version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: balashikshana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-balashikshana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-balashikshana_dev}
      POSTGRES_DB: ${POSTGRES_DB:-balashikshana_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balashikshana -d balashikshana_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: balashikshana-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: balashikshana-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://balashikshana:balashikshana_dev@postgres:5432/balashikshana_db
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:4200}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: balashikshana-web
    restart: unless-stopped
    environment:
      PORT: 8080
      API_URL: http://localhost:4000
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
