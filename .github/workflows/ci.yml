name: Balashikshana Build & Curriculum CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Compute-saving: superseded runs on the same ref are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate Curriculum, Engine Specs & API Integration (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: balashikshana
          POSTGRES_PASSWORD: balashikshana_dev
          POSTGRES_DB: balashikshana_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balashikshana -d balashikshana_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://balashikshana:balashikshana_dev@localhost:5432/balashikshana_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            services/api/package-lock.json
            packages/core-engine/package-lock.json
            apps/mobile/package-lock.json
            tools/content-pipeline/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies (api, core-engine, mobile, content-pipeline)
        run: |
          npm ci --workspaces=false --prefix services/api
          npm ci --workspaces=false --prefix packages/core-engine
          npm ci --workspaces=false --prefix apps/mobile
          npm ci --workspaces=false --prefix tools/content-pipeline

      - name: Validate Canonical Curriculum Registry & 9-Asset Contract (614 Topics)
        run: python3 scripts/validate-curriculum.py

      - name: Animation Asset Budget Gate (Rive <50KB, zero raster media)
        run: node scripts/check-animation-assets.mjs

      - name: Verify Engine Package (aggregate self-check)
        run: node packages/core-engine/src/verify-engine.mjs

      - name: Core-Engine Unit Tests (vitest — mastery gate, FSRS, DAG, questions)
        run: npm test --workspaces=false --prefix packages/core-engine

      - name: Security & Edge Integration Tests (vitest — scrypt PINs, IDOR denial, CORS, rate limits, Postgres)
        run: npm test --workspaces=false --prefix services/api

      - name: Content Pack Compiler Gate (determinism, completeness vs registry, signed + tamper rejection)
        run: npm test --workspaces=false --prefix tools/content-pipeline

      - name: Mobile App Shell Quality Gate (lint, format, typecheck, design-token tests)
        run: |
          npm run lint --workspaces=false --prefix apps/mobile
          npm run format:check --workspaces=false --prefix apps/mobile
          npm run typecheck --workspaces=false --prefix apps/mobile
          npm test --workspaces=false --prefix apps/mobile

      - name: Smoke-Test Migrations, Seed & Full Route Inventory on PostgreSQL
        run: |
          node --no-warnings services/api/server.mjs &
          API_PID=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4000/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/api/health | grep -q '"totalPracticeQuestionsInDb":6140'
          curl -fsS http://127.0.0.1:4000/api/curriculum/summary > /dev/null
          curl -fsS "http://127.0.0.1:4000/api/practice/topic/K-M2/I?count=8" > /dev/null
          kill $API_PID

      - name: OpenAPI Breaking-Change Gate (oasdiff, additive-only)
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if git cat-file -e origin/main:docs/openapi/baseline.yaml 2>/dev/null; then
            git show origin/main:docs/openapi/baseline.yaml > /tmp/baseline-main.yaml
            echo "Diffing working-tree spec against origin/main baseline..."
            docker run --rm \
              -v "${PWD}:/specs:ro" \
              -v /tmp/baseline-main.yaml:/baseline.yaml:ro \
              tufin/oasdiff:v1.34.1 breaking --fail-on WARN \
              /baseline.yaml /specs/docs/openapi/baseline.yaml
            echo "No breaking API changes detected."
          else
            echo "No docs/openapi/baseline.yaml on origin/main; this change establishes the baseline."
            test -f docs/openapi/baseline.yaml
          fi
