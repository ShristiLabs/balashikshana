name: Balashikshana Build & Curriculum CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-build:
    name: Validate Curriculum DAG, 9-Asset Contract & Build Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies (pino)
        run: npm ci --workspaces=false --prefix services/api

      - name: Validate Canonical Curriculum Registry & 9-Asset Contract (614 Topics)
        run: python3 scripts/validate-curriculum.py

      - name: Validate Core Mastery & Spaced Repetition Engine
        run: node packages/core-engine/src/verify-engine.mjs

      - name: Security Tests (scrypt PINs, IDOR denial, token lifecycle, CORS, rate limits, request caps)
        run: node --experimental-sqlite --no-warnings --test 'services/api/test/*.test.mjs'

      - name: Smoke-Test SQLite Database, 6,140 Practice Questions & Curriculum API Server
        run: |
          node --experimental-sqlite --no-warnings services/api/server.mjs &
          API_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:4000/api/health
          curl -fsS http://127.0.0.1:4000/api/curriculum/summary > /dev/null
          curl -fsS "http://127.0.0.1:4000/api/practice/topic/K-M2/I?count=8" > /dev/null
          kill $API_PID
