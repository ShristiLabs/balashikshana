<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Balashikshana</title>
    <!--
      Web-export template (issue #71). Expo's static export injects the
      bundle/runtime tags into this template; the head below carries the
      PWA surface: manifest, theme color (design tokens), icons. The old
      single-HTML dev harness that used to live here was RETIRED at web
      parity (docs/journey-harness-parity.md records the decision).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#58cc02" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow-y: hidden;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
      }
      /* Avoid recursive margin collapse with the #root flex container */
      #root > *,
      #root > * > * {
        width: 100%;
      }
      /* Keyboard parity (#71, carrying #67's a11y bar to web): every
         focusable control shows a high-contrast focus ring in the brand
         green. Pressable role=button elements are tab-focusable and
         Enter/Space-activatable via react-native-web's responder. */
      #root :focus-visible {
        outline: 3px solid #3d8b37;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
