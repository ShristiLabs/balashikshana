      summary: Weekly time/progress series aggregated by ISO week (Monday UTC)
      description: |
        PARENT session tokens only; CLAIMED-binding ownership as the
        quadrant route. Active time is the sum of per-attempt cognitive
        seconds (the motor-baseline-adjusted engagement measure — the
        same field family as the quadrant speed axis), aggregated into
        Monday-anchored ISO weeks in UTC. Weeks inside the requested
        window with no activity return ZEROED rows (accuracy null, not
        0%), never errors. The series also carries per-week first-passed
        topic counts (sessions with >= 80% accuracy, first occurrence
        only) and the cumulative mastered-topics curve. `weeks` defaults
        to 8, capped at 26.
      parameters:
        - $ref: "#/components/parameters/SessionToken"
