          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalWeeklyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such child is linked to this parent account (problem+json)
          content:
