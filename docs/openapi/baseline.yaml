# Balashikshana Sync & Analytics API - OpenAPI baseline (issue #31).
#
# Hand-authored contract for the full route inventory served by
# services/api/server.mjs (Fastify). This file is the API BASELINE for the
# oasdiff breaking-change CI gate: pull requests are compared against the
# baseline on the target branch and the gate fails on breaking changes
# (removed paths/operations, narrowed parameters, changed response codes or
# content types). Additive evolution (new routes, new optional fields, new
# response fields) is allowed.
#
# Error contract: every error response is RFC 9457 application/problem+json
# (type, title, status, detail, instance; validation failures add `errors`
# with per-instance AJV details; 429 adds a Retry-After header).

openapi: 3.1.0
info:
  title: Balashikshana Sync & Analytics API
  version: 0.1.0
  description: |
    Pre-K to G3 learning platform API. Serves the curriculum registry,
    practice questions, student sessions (scrypt PIN auth), progress
    persistence, mastery gates, and spaced-repetition state. The datastore
    is PostgreSQL; the mastery/fluency engine is shared isomorphic code
    from packages/core-engine.
  license:
    name: Proprietary
servers:
  - url: http://localhost:4000
    description: Local development (startup.sh)
tags:
  - name: system
  - name: students
  - name: auth
  - name: parents
  - name: consent
  - name: curriculum
  - name: practice
  - name: gate

security: []

paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Database and content counts (liveness/readiness)
      responses:
        "200":
          description: Service healthy; served database reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/students:
    get:
      tags: [students]
      operationId: listStudents
      summary: Public profile cards for the login screen
      description: |
        Returns public profile fields only. With a valid session token the
        response additionally carries `ownSummary` (the caller's own
        progress summary). Progress data for other students is never
        included.
      parameters:
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: Public student cards (plus own summary when authed)
          content:
            application/json:
              schema:
                type: object
                required: [students]
                properties:
                  students:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudentPublic"
                  ownSummary:
                    $ref: "#/components/schemas/StudentSummary"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [students]
      operationId: registerStudent
      summary: Register a new student account and open a session (consent-gated)
      description: |
        Consent-required middleware (issue #41): child-profile creation
        requires a `Bearer` PARENT session token whose account email is
        verified and whose latest consent record matches the active
        consent-policy version. Missing/invalid token -> 401; a student
        token or an unverified parent -> 403 wrong-token-type /
        email-verification-required; no current-version consent -> 403
        consent-required (problem body carries `currentPolicyVersion`).
        On success the student-scoped consent binding row is written in the
        same transaction as the student row. The 201 response contract is
        unchanged (student session token issued).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; session token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStateResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/students/{studentId}:
    get:
      tags: [students]
      operationId: getStudentState
      summary: Full student state (session must own this student)
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: Full state (student profile + progress + summary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentFullState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/students/{studentId}/calibrate:
    post:
      tags: [students]
      operationId: calibrateStudent
      summary: Update the student's motor baseline (session must own this student)
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrateRequest"
      responses:
        "200":
          description: Updated full student state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentFullState"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate by username (or studentId) + 4-digit PIN
      description: |
        Unknown user, wrong PIN, and missing PIN all fail uniformly (401)
        so responses cannot enumerate accounts. Stricter per-IP rate limit
        than other routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session token (30-day TTL) issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStateResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the caller's session token
      parameters:
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/parents/signup:
    post:
      tags: [parents]
      operationId: signupParent
      summary: Create a parent account (email stored unverified) and issue an email-verification token
      description: |
        Passwords are scrypt-hashed with the shared db.mjs parameters.
        Duplicate (case-insensitive) email returns 409. The verification
        token is single-use, expires after 24 hours, and is returned in the
        response body only in non-production environments (dev email-seam;
        production sends it via the #63 SMTP seam).
        Rate limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentSignupRequest"
      responses:
        "201":
          description: Parent created; email not yet verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentSignupResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/parents/verify-email:
    post:
      tags: [parents]
      operationId: verifyParentEmail
      summary: Consume an email-verification token and mark the email verified
      description: |
        The token is consumed exactly once (atomic consume; replays and
        expired tokens all fail with the same 400 invalid-token problem, so
        the failure mode is not an oracle). `email_verified_at` is set only
        through this route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentTokenRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                required: [ok, emailVerified]
                properties:
                  ok:
                    type: boolean
                    const: true
                  emailVerified:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/Validation"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/parents/login:
    post:
      tags: [parents]
      operationId: loginParent
      summary: Authenticate a parent by email + password and issue a session token
      description: |
        Unknown email and wrong password return byte-identical 401 problems
        (a dummy scrypt verification runs on the unknown-account path to
        equalize timing). Login is allowed before email verification; the
        response carries `emailVerified` so consent-gated surfaces (#41)
        can enforce verification. Parent session tokens are distinct from
        student session tokens: student routes reject them with a 403
        wrong-token-type problem.
        Rate limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentCredentialsRequest"
      responses:
        "200":
          description: Authenticated; parent session token issued (7-day TTL, 30-day refresh window)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentLoginResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/parents/refresh:
    post:
      tags: [parents]
      operationId: refreshParentSession
      summary: Rotate the parent session token within its refresh window
      description: |
        Requires a valid, unrevoked parent bearer token. Rotation revokes
        the presented token and issues a fresh one with a new 7-day TTL and
        a new 30-day refresh window (sliding per lineage). Beyond the
        refresh window the reply is a 401 refresh-expired problem.
      parameters:
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: Rotated; new session token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/parents/logout:
    post:
      tags: [parents]
      operationId: logoutParent
      summary: Revoke the caller's parent session token
      parameters:
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/parents/logout-all:
    post:
      tags: [parents]
      operationId: logoutAllParentSessions
      summary: Revoke every active session for the authenticated parent
      parameters:
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: All active sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok, revokedSessions]
                properties:
                  ok:
                    type: boolean
                    const: true
                  revokedSessions:
                    type: integer
                    description: Number of sessions that were still active
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/parents/password-reset/request:
    post:
      tags: [parents]
      operationId: requestParentPasswordReset
      summary: Request a password reset (response is identical whether or not the email exists)
      description: |
        Always returns 202 with the same body for known and unknown emails
        (no account enumeration). When the account exists, a single-use
        1-hour reset token is minted and any outstanding reset token for
        the parent is superseded; the token is returned in the response
        body only in non-production environments (dev email-seam).
        Rate limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentEmailRequest"
      responses:
        "202":
          description: Reset requested (uniform body; no existence signal)
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                    const: true
                  message:
                    type: string
                  resetToken:
                    type: string
                    description: Dev email-seam only (non-production); never present in production
                  resetTokenExpiresAt:
                    type: string
                    description: Dev email-seam only (non-production)
        "400":
          $ref: "#/components/responses/Validation"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/parents/password-reset/confirm:
    post:
      tags: [parents]
      operationId: confirmParentPasswordReset
      summary: Consume a reset token, set the new password, and revoke all sessions
      description: |
        The token is consumed exactly once; replays and expired tokens fail
        with the same 400 invalid-token problem. A successful reset updates
        the scrypt password hash, revokes every active parent session, and
        supersedes remaining reset tokens.
        Rate limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentResetConfirmRequest"
      responses:
        "200":
          description: Password updated; all sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/Validation"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/consent/policy/latest:
    get:
      tags: [consent]
      operationId: getLatestConsentPolicy
      summary: The active consent policy version and text (public)
      description: |
        Returns the single active row of the append-only
        `consent_policy_versions` catalog for the client to render before
        onboarding. Public by design (policy text is not personal data).
        The seeded v1 text is a placeholder clearly marked NON-LEGAL; the
        production text arrives with the M6 compliance pack.
      responses:
        "200":
          description: Active policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentPolicyResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/consent/records:
    post:
      tags: [consent]
      operationId: captureConsentRecord
      summary: Record timestamped verifiable parental consent (append-only)
      description: |
        Requires a `Bearer` PARENT session token whose account email is
        verified (unverified -> 403 email-verification-required; student
        token -> 403 wrong-token-type). The body names the policy version
        being accepted; anything other than the active version is a 409
        policy-version-mismatch whose problem body carries
        `currentPolicyVersion`. An optional `studentId` scopes the consent
        to a bound child (403 no-child-binding without a parent_children
        row; parent-level capture leaves it out until #42). Timestamps are
        server-side only and the capture method is derived server-side
        (signup-form for a first acceptance, re-consent thereafter); the
        schema is closed, so clients cannot assert either. Consent rows are
        immutable — corrections are new rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRecordRequest"
      responses:
        "201":
          description: Consent recorded (append-only insert)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecordResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            policy-version-mismatch: the requested version is not the
            active one; the problem body carries `currentPolicyVersion`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/consent/status:
    get:
      tags: [consent]
      operationId: getConsentStatus
      summary: The parent's latest consent and whether it matches the active policy version
      description: |
        Requires a `Bearer` PARENT session token (student token -> 403
        wrong-token-type). `consentCurrent` false means the client must
        surface the policy and parental gate again (re-consent) before any
        child-data creation will succeed.
      responses:
        "200":
          description: Consent status for the calling parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/curriculum/summary:
    get:
      tags: [curriculum]
      operationId: getCurriculumSummary
      summary: Grades, subjects, units, and skill-topic overview
      responses:
        "200":
          description: Full curriculum tree with per-grade spaced-repetition policy
          content:
            application/json:
              schema:
                type: object
                required: [summary, grades]
                properties:
                  summary:
                    $ref: "#/components/schemas/CurriculumCounts"
                  grades:
                    type: array
                    items:
                      $ref: "#/components/schemas/CurriculumGrade"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/curriculum/unit/{unitId}:
    get:
      tags: [curriculum]
      operationId: getUnit
      summary: Unit detail plus stratified Boss Gate questions
      parameters:
        - $ref: "#/components/parameters/UnitId"
        - name: count
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
          description: Number of gate questions to select (defaults to the unit's gate size)
      responses:
        "200":
          description: Unit with skill topics and selected gate questions
          content:
            application/json:
              schema:
                type: object
                required: [unit, generatedQuestions]
                properties:
                  unit:
                    $ref: "#/components/schemas/CurriculumUnit"
                  generatedQuestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PracticeQuestion"
        "400":
          $ref: "#/components/responses/Validation"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/practice/topic/{unitId}/{topicCode}:
    get:
      tags: [practice]
      operationId: getTopicPractice
      summary: Stored practice questions for one skill topic
      parameters:
        - $ref: "#/components/parameters/UnitId"
        - name: topicCode
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Topic code within the unit (topicId is `{unitId}-{topicCode}`)
        - name: count
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 8
          description: Number of questions to return
      responses:
        "200":
          description: Topic metadata and practice problems ordered by difficulty
          content:
            application/json:
              schema:
                type: object
                required: [unitId, unitTitle, targetSpeedSec, minAccuracyPercent, topic, practiceProblems]
                properties:
                  unitId:
                    type: string
                  unitTitle:
                    type: string
                  targetSpeedSec:
                    type: number
                  minAccuracyPercent:
                    type: integer
                    const: 80
                  topic:
                    $ref: "#/components/schemas/SkillTopic"
                  practiceProblems:
                    type: array
                    items:
                      $ref: "#/components/schemas/PracticeQuestion"
        "400":
          $ref: "#/components/responses/Validation"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/practice/topic/complete:
    post:
      tags: [practice]
      operationId: completeTopicPractice
      summary: Persist a topic-practice session (attempts, crowns, spaced repetition)
      description: |
        Session token must belong to `studentId`. Consent-required
        middleware (issue #41): the student must have current-version
        consent (the creation-time binding row, or a parent-level row at
        the active version via consent lineage); otherwise 403
        consent-required with `currentPolicyVersion` and nothing is
        written.
      parameters:
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeCompleteRequest"
      responses:
        "200":
          description: Completion outcome with updated student state and SR schedule
          content:
            application/json:
              schema:
                type: object
                required: [passedTopic, crownsAwarded, accuracyPct, medianCogSpeedSec, targetSpeedSec, bossGateUnlocked, spacedRepetition, student, summary]
                properties:
                  passedTopic:
                    type: boolean
                  crownsAwarded:
                    type: integer
                  accuracyPct:
                    type: number
                  medianCogSpeedSec:
                    type: number
                  targetSpeedSec:
                    type: number
                  bossGateUnlocked:
                    type: boolean
                  spacedRepetition:
                    $ref: "#/components/schemas/SpacedRepetitionUpdate"
                  student:
                    $ref: "#/components/schemas/StudentProfile"
                  summary:
                    $ref: "#/components/schemas/StudentSummary"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /api/gate/evaluate:
    post:
      tags: [gate]
      operationId: evaluateGate
      summary: Evaluate a Unit Boss Gate attempt and persist unit mastery
      description: |
        Session token must belong to `studentId`. Consent-required
        middleware (issue #41): the student must have current-version
        consent (the creation-time binding row, or a parent-level row at
        the active version via consent lineage); otherwise 403
        consent-required with `currentPolicyVersion` and nothing is
        written.
      parameters:
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateEvaluateRequest"
      responses:
        "200":
          description: Gate evaluation with key award and updated state
          content:
            application/json:
              schema:
                type: object
                required: [student, summary, evaluation, spacedRepetition]
                properties:
                  student:
                    $ref: "#/components/schemas/StudentProfile"
                  summary:
                    $ref: "#/components/schemas/StudentSummary"
                  evaluation:
                    type: object
                    required: [passed, keyAwarded]
                    properties:
                      passed:
                        type: boolean
                      keyAwarded:
                        type:
                          - string
                          - "null"
                        enum: [SILVER_KEY, GOLD_KEY, null]
                      overallAccuracyPct:
                        type: number
                      medianCogSpeedSec:
                        type: number
                  spacedRepetition:
                    $ref: "#/components/schemas/SpacedRepetitionUpdate"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

components:
  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Student identifier (e.g. stu-maya-pk)
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Unit identifier (e.g. K-M2)
    SessionToken:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: "`Bearer <token>` from login/registration; required on student-scoped routes"

  responses:
    Validation:
      description: Request failed schema validation (problem+json carries AJV details in `errors`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, malformed, unknown, expired, or revoked session token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Session does not grant access to the requested student, the token
        is of the wrong type for the route (e.g. a parent session token on
        a student route), the parent email is unverified on a consent
        surface, or current-version parental consent is missing
        (consent-required / no-child-binding; the consent problems carry
        `currentPolicyVersion` where applicable).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Unknown route, student, unit, or topic
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body exceeds the configured byte limit
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Rate limit exceeded (per-IP, per-session-token, or login); Retry-After header present
      headers:
        Retry-After:
          description: Seconds until the fixed window resets
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Internal:
      description: Unexpected server error (no internals leaked)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Resource already exists (e.g. parent signup with a registered email)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      description: RFC 9457 problem details; served as application/problem+json on every error
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          description: Problem type URI (about:blank when unspecified)
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Present on 400 validation failures; per-instance schema errors
          items:
            type: object
            additionalProperties: true
        currentPolicyVersion:
          type: string
          description: |
            RFC 9457 extension member present on consent problems
            (consent-required, policy-version-mismatch): the active consent
            policy version the parent must accept.

    HealthResponse:
      type: object
      required: [status, databaseEngine, totalGrades, totalUnits, totalSkillTopics, totalPracticeQuestionsInDb, totalStudentsInDb, totalQuestionAttemptsInDb]
      properties:
        status:
          type: string
          const: ok
        databaseEngine:
          type: string
        totalGrades:
          type: integer
        totalUnits:
          type: integer
        totalSkillTopics:
          type: integer
        totalPracticeQuestionsInDb:
          type: integer
        totalStudentsInDb:
          type: integer
        totalQuestionAttemptsInDb:
          type: integer

    LoginRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [username]
        - required: [studentId]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Username or nickname (case-insensitive)
        studentId:
          type: string
          minLength: 1
          maxLength: 64
        pin:
          type: string
          pattern: "^[0-9]{4}$"
          description: 4-digit PIN (whitespace-trimmed before validation)

    RegisterRequest:
      type: object
      required: [pin]
      properties:
        nickname:
          type: string
          maxLength: 32
        username:
          type: string
          maxLength: 32
        pin:
          type: string
          pattern: "^[0-9]{4}$"
        currentGrade:
          type: string
          enum: [pre-k, kindergarten, grade-1, grade-2, grade-3]
        ageYears:
          type: number
          minimum: 3
          maximum: 10
        avatar:
          type: string
          maxLength: 8

    CalibrateRequest:
      type: object
      properties:
        warmupTapTimesSec:
          type: array
          items:
            type: number
          description: Warm-up tap durations; the median becomes the motor baseline
        motorBaselineSec:
          type: number
          minimum: 0
          maximum: 5

    PracticeCompleteRequest:
      type: object
      required: [studentId, unitId, topicCode]
      properties:
        studentId:
          type: string
          minLength: 1
        unitId:
          type: string
          minLength: 1
        topicCode:
          type: string
          minLength: 1
        motorBaselineSec:
          type: number
        responses:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: string
              chosenAnswer:
                type:
                  - string
                  - number
              isCorrect:
                type: boolean
              rawTimeSec:
                type: number
              misconceptionTags:
                type: array
                items:
                  type: string

    GateEvaluateRequest:
      type: object
      required: [studentId, unitId]
      properties:
        studentId:
          type: string
          minLength: 1
        unitId:
          type: string
          minLength: 1
        motorBaselineSec:
          type: number
        responses:
          type: array
          items:
            type: object
            properties:
              topicCode:
                type: string
              isCorrect:
                type: boolean
              rawTimeSec:
                type: number

    AuthStateResponse:
      type: object
      required: [token, student, summary]
      properties:
        token:
          type: string
          description: Opaque base64url session token (30-day TTL)
        student:
          $ref: "#/components/schemas/StudentProfile"
        summary:
          $ref: "#/components/schemas/StudentSummary"

    ParentSignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Email address (whitespace-trimmed, stored and matched case-insensitively)
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Parent password (leading/trailing whitespace trimmed before validation and hashing, so the length bounds apply post-trim; interior spaces allowed); stored as a salted scrypt hash

    ParentCredentialsRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Email address (matched case-insensitively)
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Parent password (leading/trailing whitespace trimmed; bounds apply post-trim)

    ParentEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254

    ParentTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: Single-use base64url token from signup (email verification)

    ParentResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: Single-use base64url reset token from password-reset/request
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: New parent password (leading/trailing whitespace trimmed; bounds apply post-trim)

    ParentAccount:
      type: object
      required: [parentId, email, emailVerified]
      properties:
        parentId:
          type: string
          description: App-generated parent identifier (par-... convention)
        email:
          type: string
        emailVerified:
          type: boolean
        emailVerifiedAt:
          type:
            - string
            - "null"

    ParentSignupResponse:
      type: object
      required: [parentId, email, emailVerified]
      properties:
        parentId:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
          const: false
        verificationToken:
          type: string
          description: Dev email-seam only (non-production); never present in production
        verificationTokenExpiresAt:
          type: string
          description: Dev email-seam only (non-production)

    ParentLoginResponse:
      type: object
      required: [token, parent]
      properties:
        token:
          type: string
          description: Opaque base64url parent session token (7-day TTL, 30-day refresh window)
        parent:
          $ref: "#/components/schemas/ParentAccount"

    ParentTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Rotated parent session token (old token revoked)

    ConsentPolicyResponse:
      type: object
      required: [version, locale, policyText, createdAt, active]
      properties:
        version:
          type: string
          description: Active policy version (e.g. "1"); the value consent captures must reference
        locale:
          type: string
        policyText:
          type: string
          description: Full policy text (v1 is a placeholder clearly marked NON-LEGAL until the M6 compliance pack)
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
          const: true

    ConsentRecordRequest:
      type: object
      additionalProperties: false
      required: [policyVersion]
      properties:
        policyVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: The policy version being accepted; must equal the active version (else 409)
        studentId:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Optional: scope the consent to a bound child. Requires an
            existing parent_children binding (#42 creates those); pre-#42
            captures are parent-level (omit the field).

    ConsentRecordResponse:
      type: object
      required: [consentId, parentId, studentId, policyVersion, method, capturedAt]
      properties:
        consentId:
          type: string
        parentId:
          type: string
        studentId:
          type: [string, "null"]
          description: The bound child, or null for a parent-level capture
        policyVersion:
          type: string
        method:
          type: string
          enum: [signup-form, re-consent]
          description: Server-derived (first acceptance vs. acceptance after a policy bump); never client-asserted
        capturedAt:
          type: string
          format: date-time
          description: Server-stamped capture time (timestamptz now(); clients never supply it)

    ConsentStatusResponse:
      type: object
      required: [currentPolicyVersion, consentCurrent, latestConsent]
      properties:
        currentPolicyVersion:
          type: [string, "null"]
        consentCurrent:
          type: boolean
          description: False means re-consent is required before child-data creation will succeed
        latestConsent:
          oneOf:
            - type: "null"
            - type: object
              required: [policyVersion, capturedAt, method, studentId]
              properties:
                policyVersion:
                  type: string
                capturedAt:
                  type: string
                  format: date-time
                method:
                  type: string
                  enum: [signup-form, re-consent]
                studentId:
                  type: [string, "null"]

    StudentPublic:
      type: object
      required: [studentId, username, nickname, avatar, ageYears, currentGrade]
      properties:
        studentId:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        ageYears:
          type: integer
        currentGrade:
          type: string
          enum: [pre-k, kindergarten, grade-1, grade-2, grade-3]

    StudentProfile:
      description: Full student record with progress maps (shape is engine-defined and additive)
      allOf:
        - $ref: "#/components/schemas/StudentPublic"
        - type: object
          required: [motorBaselineSec, streakDays, starCoins, hearts, unitProgress, topicMastery]
          properties:
            motorBaselineSec:
              type: number
            streakDays:
              type: integer
            starCoins:
              type: integer
            hearts:
              type: integer
            unitProgress:
              type: object
              additionalProperties:
                type: object
                additionalProperties: true
            topicMastery:
              type: object
              additionalProperties:
                type: object
                additionalProperties: true

    StudentSummary:
      type: object
      required: [studentId, completedTopicsCount, masteredUnitsCount, goldKeysCount, silverKeysCount, dueSpacedReviewsCount, gardenHealthPct, totalQuestionAttemptsLogged]
      properties:
        studentId:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        ageYears:
          type: integer
        currentGrade:
          type: string
        motorBaselineSec:
          type: number
        streakDays:
          type: integer
        starCoins:
          type: integer
        hearts:
          type: integer
        completedTopicsCount:
          type: integer
        masteredUnitsCount:
          type: integer
        goldKeysCount:
          type: integer
        silverKeysCount:
          type: integer
        dueSpacedReviewsCount:
          type: integer
        gardenHealthPct:
          type: integer
        totalQuestionAttemptsLogged:
          type: integer

    StudentFullState:
      type: object
      required: [student, summary]
      properties:
        student:
          $ref: "#/components/schemas/StudentProfile"
        summary:
          $ref: "#/components/schemas/StudentSummary"

    CurriculumCounts:
      type: object
      required: [totalGrades, totalUnits, totalSkillTopics, totalPracticeQuestionsInDb]
      properties:
        totalGrades:
          type: integer
        totalUnits:
          type: integer
        totalSkillTopics:
          type: integer
        totalPracticeQuestionsInDb:
          type: integer

    CurriculumGrade:
      type: object
      required: [gradeId, gradeName, targetAgeYears, spacedRepetitionPolicy, subjects]
      properties:
        gradeId:
          type: string
        gradeName:
          type: string
        targetAgeYears:
          type: string
        spacedRepetitionPolicy:
          type: object
          required: [stabilityGrowthFactor, maxIntervalCapDays, baseScheduleDays]
          properties:
            stabilityGrowthFactor:
              type: number
            maxIntervalCapDays:
              type: integer
            baseScheduleDays:
              type: array
              items:
                type: integer
        subjects:
          type: object
          additionalProperties:
            type: object
            required: [totalUnits, totalSkillTopics, units]
            properties:
              totalUnits:
                type: integer
              totalSkillTopics:
                type: integer
              units:
                type: array
                items:
                  $ref: "#/components/schemas/CurriculumUnitSummary"

    CurriculumUnitSummary:
      type: object
      required: [unitId, sequenceOrder, title, prerequisiteUnitIds, masteryGate, skillTopics]
      properties:
        unitId:
          type: string
        sequenceOrder:
          type: integer
        title:
          type: string
        prerequisiteUnitIds:
          type: array
          items:
            type: string
        masteryGate:
          $ref: "#/components/schemas/MasteryGate"
        skillTopics:
          type: array
          items:
            type: object
            required: [code, name, topicId]
            properties:
              code:
                type: string
              name:
                type: string
              topicId:
                type: string

    CurriculumUnit:
      type: object
      required: [unitId, gradeId, subject, sequenceOrder, title, prerequisiteUnitIds, masteryGate, skillTopics]
      properties:
        unitId:
          type: string
        gradeId:
          type: string
        subject:
          type: string
        sequenceOrder:
          type: integer
        title:
          type: string
        prerequisiteUnitIds:
          type: array
          items:
            type: string
        masteryGate:
          $ref: "#/components/schemas/MasteryGate"
        skillTopics:
          type: array
          items:
            $ref: "#/components/schemas/SkillTopic"

    MasteryGate:
      type: object
      required: [questionCount, minAccuracyPercent, maxMedianResponseTimeSec, challengeZoneStreak]
      properties:
        questionCount:
          type: integer
        minAccuracyPercent:
          type: number
        maxMedianResponseTimeSec:
          type: number
        challengeZoneStreak:
          type: integer

    SkillTopic:
      type: object
      required: [topicId, code, name, assets]
      properties:
        topicId:
          type: string
        code:
          type: string
        name:
          type: string
        assets:
          type: object
          additionalProperties: true
          description: 9-asset contract payload (song, story, video, game, ...)

    PracticeQuestion:
      description: Stored practice question (shape is engine-defined and additive)
      type: object
      required: [questionId, topicId, unitId, topicCode, topicName, difficultyLevel, interactionType, prompt, visualAid, choices, correctAnswer, misconceptionTags, explanation]
      properties:
        questionId:
          type: string
        topicId:
          type: string
        unitId:
          type: string
        topicCode:
          type: string
        topicName:
          type: string
        difficultyLevel:
          type: integer
        interactionType:
          type: string
        prompt:
          type: string
        visualAid:
          type: string
        visualObjects:
          type: array
          items: {}
        targetCount:
          type: integer
        maxCounterCells:
          type: integer
        counterEmoji:
          type: string
        tileBank:
          type: array
          items:
            type: string
        choices:
          type: array
          items: {}
        correctAnswer:
          type: string
        misconceptionTags:
          type: array
          items:
            type: string
        explanation:
          type: string

    SpacedRepetitionUpdate:
      type: object
      required: [stabilityDays]
      properties:
        stabilityDays:
          type: number
        cpaStage:
          type: string
        nextReviewAt:
          type: string
          format: date-time
        retrievabilityPct:
          type: number
