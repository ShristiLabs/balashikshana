  /api/sync/attempts:
    post:
      tags: [sync]
      operationId: uploadSyncAttempts
      summary: Batch delta upload of client attempts; idempotent reconciliation via core-engine (D8)
      description: |
        CHILD-DEVICE session tokens only (issue #48 sync doctrine): the
        student AND the idempotency device component come from the token
        binding, never the body; parent and student PIN tokens get 403
        wrong-token-type. Consent-required middleware applies (403
        consent-required, nothing written) and archived children are
        frozen out (403 child-archived).

        Idempotency is database-enforced: each attempt is uniquely keyed
        by (student, device, client sequence); a replayed or duplicated
        batch inserts nothing, reconciles nothing, and returns the same
        authoritative snapshot (same batch twice = same server state).
        Protocol contract: a batch carries WHOLE sessions (the client
        drains at session boundaries); the server replays every uploaded
        session over the union of its batch rows and any previously
        persisted rows of the same session, so progress counting is
        exactly-once per session even if a client violates the contract
        and splits one across batches (defense-in-depth convergence).
        Topic/unit progress is recomputed through the same shared
        derivations as /api/practice/topic/complete and
        /api/gate/evaluate, with the registry two-key machine (Silver on
        pass; Gold only via the 14-hour + 5-item verification route).
        Clock policy: past client timestamps are accepted as-is; a
        future timestamp beyond the server tolerance (default 5 minutes)
        is clamped to server receive time and counted in
        stats.clockSkewAdjusted. One unknown unit/topic fails the whole
        batch (400 sync-unknown-content) with nothing written. Dedicated
        per-token sync rate bucket (env RATE_LIMIT_SYNC_PER_TOKEN_MIN,
        default 30/min) on top of the global buckets.

        #61 parent time limits (server-side enforcement): when the
        child's parent has configured a daily limit and the child's
        RECORDED active time (sum of per-attempt cognitive seconds) for
        the current UTC day is at or over the cap, a batch that would
        add today-dated sessions is refused whole with 429
        time-limit-exceeded (problem extensions limitMinutes /
        usedMinutes / resetsAtUtc, Retry-After until the UTC reset).
        Backfill of earlier UTC days always lands; the device keeps its
        append-only queue and retries after reset. No limit configured
        (the default) leaves the route unchanged.
      parameters:
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUploadRequest"
      responses:
        "200":
          description: Acknowledged sequences, reconciliation stats, and the authoritative progress snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncUploadResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

