        other portal routes. Returns the effective settings — the stored
        row, or the platform defaults when the parent has not configured
        anything (no daily limit, nothing restricted, no grade ceiling,
        reminders OFF per the #57 COPPA-safe default) — plus today's
        recorded active minutes and the exceeded flag so the portal can
        render the live cap state.
      parameters:
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Effective settings and today's usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such child is linked to this parent account (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [portal]
      operationId: putChildSettings
      summary: Upsert the parent's controls for one child (full-shape replace)
      description: |
        PARENT session tokens only; CLAIMED-binding ownership. Full-shape
        upsert: the body IS the new effective state (absent optional
        fields reset to defaults; restrictedSubjects and
        remindersEnabled are required so the choice is always explicit).
        Bounds: dailyLimitMinutes null (unlimited) or 5-480;
        restrictedSubjects a unique subset of math, ela, science,
        socialStudies; gradeCeiling null or a registry grade id;
        reminder time integers 0-23 / 0-59 (stored as the 17:00 default
        shape when reminders are disabled). Enforcement is server-side:
        the daily cap refuses new-practice sync uploads once the child's
        recorded active time for the UTC day reaches it (429
        time-limit-exceeded on POST /api/sync/attempts), subject and
        grade controls empty the question-serving routes for child
        callers, and above-ceiling pack artifacts are a 403.
      parameters:
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalChildSettings"
      responses:
        "200":
          description: The stored settings row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSettingsPutResponse"
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such child is linked to this parent account (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

components:
  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Student identifier (e.g. stu-maya-pk)
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Unit identifier (e.g. K-M2)
    SessionToken:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: "`Bearer <token>` from login/registration; required on student-scoped routes"

  responses:
    Validation:
      description: Request failed schema validation (problem+json carries AJV details in `errors`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, malformed, unknown, expired, or revoked session token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Session does not grant access to the requested student, the token
        is of the wrong type for the route (e.g. a parent session token on
        a student route), the parent email is unverified on a consent
        surface, or current-version parental consent is missing
        (consent-required / no-child-binding; the consent problems carry
        `currentPolicyVersion` where applicable).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Unknown route, student, unit, topic, or grade pack
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ContentPacksUnavailable:
      description: |
        No compiled content-pack index is published on this server, or the
        published index references a missing/inconsistent/invalidly-named
        artifact. Serving suspect bytes is refused (problem+json); rebuild
        via the content-pipeline tool (tools/content-pipeline).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body exceeds the configured byte limit
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Rate limit exceeded (per-IP, per-session-token, or login); Retry-After header present
      headers:
        Retry-After:
          description: Seconds until the fixed window resets
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Internal:
      description: Unexpected server error (no internals leaked)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Resource already exists (e.g. parent signup with a registered email)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    GamificationLevelInfo:
      type: object
      required: [level, maxLevel, maxed, levelFloorXp, xpIntoLevel]
      description: Engine level-curve projection of a cumulative XP total (issue #55).
      properties:
        level:
          type: integer
          minimum: 1
        maxLevel:
          type: integer
        maxed:
          type: boolean
        levelFloorXp:
          type: integer
        nextLevelXp:
          type:
            - integer
            - "null"
        xpIntoLevel:
          type: integer
        xpToNextLevel:
          type:
            - integer
            - "null"

    GamificationBadgeAward:
      type: object
      required: [id, title, scope, awardedAt]
      description: An earned badge; metadata comes from the engine's badge catalog.
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type:
            - string
            - "null"
        tier:
          type:
            - string
            - "null"
          enum: [bronze, silver, gold, null]
        scope:
          type: string
        awardedAt:
          type: string
          format: date-time

    GamificationXpEvent:
      type: object
      required: [sessionType, sessionId, xpAmount, reason, awardedAt]
      properties:
        sessionType:
          type: string
          # The legacy closed enum stays byte-identical to the published
          # contract: under the oasdiff additive-only gate both growing a
          # closed response enum AND removing it are breaking errors. The
          # x-extensible-enum extension declares the growth vocabulary
          # (PLACEMENT in #60) — oasdiff treats x-extensible-enum value
          # additions as non-breaking. Future session types extend
          # x-extensible-enum ONLY. Unknown-value policy on old clients
          # is ignore-and-skip (the mobile projector tolerates
          # unrecognized session types on adoption).
          enum: [TOPIC_PRACTICE, GATE, GOLD_VERIFICATION, GAME]
          x-extensible-enum: [TOPIC_PRACTICE, GATE, GOLD_VERIFICATION, GAME, PLACEMENT]
        sessionId:
          type: string
        unitId:
          type:
            - string
            - "null"
        topicId:
          type:
            - string
            - "null"
        xpAmount:
          type: integer
        reason:
          type: string
          enum: [attempt, topic-pass, gate-pass, gold-upgrade]
        awardedAt:
          type: string
          format: date-time

    GamificationLedger:
      type: object
      required: [studentId, totalXp, level, starCoins, streakDays, bestBeatTargetPct, badges, badgesAvailable, recentXpEvents, crowns, generatedAt]
      properties:
        studentId:
          type: string
        totalXp:
          type: integer
        level:
          $ref: "#/components/schemas/GamificationLevelInfo"
        starCoins:
          type: integer
        streakDays:
          type: integer
        bestBeatTargetPct:
          type: number
          description: Best beat-the-target share over the student's game topic-groups (speed badge input).
        badges:
          type: array
          items:
            $ref: "#/components/schemas/GamificationBadgeAward"
        badgesAvailable:
          type: integer
          description: Count of DISTINCT badges already earned (catalog size minus available remains derivable client-side).
        recentXpEvents:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/GamificationXpEvent"
        crowns:
          type: object
          required: [topicsWithCrowns, threeCrownTopics, totalCrowns]
          properties:
            topicsWithCrowns:
              type: integer
            threeCrownTopics:
              type: integer
            totalCrowns:
              type: integer
        generatedAt:
          type: string
          format: date-time

    ContentPackManifestEntry:
      type: object
      required:
        - formatVersion
        - gradeId
        - gradeName
        - contentVersion
        - registryVersion
        - artifact
        - sizeBytes
        - sha256
        - keyId
        - signature
        - unitCount
        - topicCount
        - questionCount
      properties:
        formatVersion:
          type: integer
          description: Pack manifest envelope version (device refuses unknown values)
        gradeId:
          type: string
          pattern: "^[a-z0-9-]+$"
        gradeName:
          type: string
        contentVersion:
          type: string
          description: Semver-like content version derived from the registry version
        registryVersion:
          type: string
        artifact:
          type: string
          description: Pack artifact file name (pack-<gradeId>-v<contentVersion>.sqlite)
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        keyId:
          type: string
          description: Signing key identifier resolved against the app's pinned key registry
        signature:
          type: string
          description: Detached Ed25519 signature over the artifact bytes (base64, 64 bytes)
        unitCount:
          type: integer
        topicCount:
          type: integer
        questionCount:
          type: integer

    Problem:
      description: RFC 9457 problem details; served as application/problem+json on every error
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          description: Problem type URI (about:blank when unspecified)
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Present on 400 validation failures; per-instance schema errors
          items:
            type: object
            additionalProperties: true
        currentPolicyVersion:
          type: string
          description: |
            RFC 9457 extension member present on consent problems
            (consent-required, policy-version-mismatch): the active consent
            policy version the parent must accept.

    HealthResponse:
      type: object
      required: [status, databaseEngine, totalGrades, totalUnits, totalSkillTopics, totalPracticeQuestionsInDb, totalStudentsInDb, totalQuestionAttemptsInDb]
      properties:
        status:
          type: string
          const: ok
        databaseEngine:
          type: string
        totalGrades:
          type: integer
        totalUnits:
          type: integer
        totalSkillTopics:
          type: integer
        totalPracticeQuestionsInDb:
          type: integer
        totalStudentsInDb:
          type: integer
        totalQuestionAttemptsInDb:
          type: integer

    LoginRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [username]
        - required: [studentId]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Username or nickname (case-insensitive)
        studentId:
          type: string
          minLength: 1
          maxLength: 64
        pin:
          type: string
          pattern: "^[0-9]{4}$"
          description: 4-digit PIN (whitespace-trimmed before validation)

    RegisterRequest:
      type: object
      required: [pin]
      properties:
        nickname:
          type: string
          maxLength: 32
        username:
          type: string
          maxLength: 32
        pin:
          type: string
          pattern: "^[0-9]{4}$"
        currentGrade:
          type: string
          enum: [pre-k, kindergarten, grade-1, grade-2, grade-3]
        ageYears:
          type: number
          minimum: 3
          maximum: 10
        avatar:
          type: string
          maxLength: 8

    CalibrateRequest:
      type: object
      properties:
        warmupTapTimesSec:
          type: array
          items:
            type: number
          description: Warm-up tap durations; the median becomes the motor baseline
        motorBaselineSec:
          type: number
          minimum: 0
          maximum: 5

    PracticeCompleteRequest:
      type: object
      required: [studentId, unitId, topicCode]
      properties:
        studentId:
          type: string
          minLength: 1
        unitId:
          type: string
          minLength: 1
        topicCode:
          type: string
          minLength: 1
        motorBaselineSec:
          type: number
        responses:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: string
              chosenAnswer:
                type:
                  - string
                  - number
              isCorrect:
                type: boolean
              rawTimeSec:
                type: number
              misconceptionTags:
                type: array
                items:
                  type: string

    GateEvaluateRequest:
      type: object
      required: [studentId, unitId]
      properties:
        studentId:
          type: string
          minLength: 1
        unitId:
          type: string
          minLength: 1
        motorBaselineSec:
          type: number
        responses:
          type: array
          items:
            type: object
            properties:
              topicCode:
                type: string
              isCorrect:
                type: boolean
              rawTimeSec:
                type: number

    AuthStateResponse:
      type: object
      required: [token, student, summary]
      properties:
        token:
          type: string
          description: Opaque base64url session token (30-day TTL)
        student:
          $ref: "#/components/schemas/StudentProfile"
        summary:
          $ref: "#/components/schemas/StudentSummary"

    ParentSignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Email address (whitespace-trimmed, stored and matched case-insensitively)
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Parent password (leading/trailing whitespace trimmed before validation and hashing, so the length bounds apply post-trim; interior spaces allowed); stored as a salted scrypt hash

    ParentCredentialsRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Email address (matched case-insensitively)
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Parent password (leading/trailing whitespace trimmed; bounds apply post-trim)

    ParentEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254

    ParentTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: Single-use base64url token from signup (email verification)

    ParentResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: Single-use base64url reset token from password-reset/request
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: New parent password (leading/trailing whitespace trimmed; bounds apply post-trim)

    ParentAccount:
      type: object
      required: [parentId, email, emailVerified]
      properties:
        parentId:
          type: string
          description: App-generated parent identifier (par-... convention)
        email:
          type: string
        emailVerified:
          type: boolean
        emailVerifiedAt:
          type:
            - string
            - "null"

    ParentSignupResponse:
      type: object
      required: [parentId, email, emailVerified]
      properties:
        parentId:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
          const: false
        verificationToken:
          type: string
          description: Dev email-seam only (non-production); never present in production
        verificationTokenExpiresAt:
          type: string
          description: Dev email-seam only (non-production)

    ParentLoginResponse:
      type: object
      required: [token, parent]
      properties:
        token:
          type: string
          description: Opaque base64url parent session token (7-day TTL, 30-day refresh window)
        parent:
          $ref: "#/components/schemas/ParentAccount"

    ParentTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Rotated parent session token (old token revoked)

    ConsentPolicyResponse:
      type: object
      required: [version, locale, policyText, createdAt, active]
      properties:
        version:
          type: string
          description: Active policy version (e.g. "1"); the value consent captures must reference
        locale:
          type: string
        policyText:
          type: string
          description: Full policy text (v1 is a placeholder clearly marked NON-LEGAL until the M6 compliance pack)
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
          const: true

    ConsentRecordRequest:
      type: object
      additionalProperties: false
      required: [policyVersion]
      properties:
        policyVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: The policy version being accepted; must equal the active version (else 409)
        studentId:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Optional: scope the consent to a bound child. Requires an
            existing parent_children binding (#42 creates those); pre-#42
            captures are parent-level (omit the field).

    ConsentRecordResponse:
      type: object
      required: [consentId, parentId, studentId, policyVersion, method, capturedAt]
      properties:
        consentId:
          type: string
        parentId:
          type: string
        studentId:
          type: [string, "null"]
          description: The bound child, or null for a parent-level capture
        policyVersion:
          type: string
        method:
          type: string
          enum: [signup-form, re-consent]
          description: Server-derived (first acceptance vs. acceptance after a policy bump); never client-asserted
        capturedAt:
          type: string
          format: date-time
          description: Server-stamped capture time (timestamptz now(); clients never supply it)

    ConsentStatusResponse:
      type: object
      required: [currentPolicyVersion, consentCurrent, latestConsent]
      properties:
        currentPolicyVersion:
          type: [string, "null"]
        consentCurrent:
          type: boolean
          description: False means re-consent is required before child-data creation will succeed
        latestConsent:
          oneOf:
            - type: "null"
            - type: object
              required: [policyVersion, capturedAt, method, studentId]
              properties:
                policyVersion:
                  type: string
                capturedAt:
                  type: string
                  format: date-time
                method:
                  type: string
                  enum: [signup-form, re-consent]
                studentId:
                  type: [string, "null"]

    ChildCreateRequest:
      type: object
      required: [pin, clientDeviceId, platform]
      additionalProperties: false
      properties:
        nickname:
          type: string
          maxLength: 32
        username:
          type: string
          maxLength: 32
        pin:
          type: string
          pattern: "^[0-9]{4}$"
          description: Child PIN; stored with the shared scrypt parameters (M1-identical hardening)
        currentGrade:
          type: string
          enum: [pre-k, kindergarten, grade-1, grade-2, grade-3]
        ageYears:
          type: number
          minimum: 3
          maximum: 10
        avatar:
          type: string
          maxLength: 8
        relation:
          type: string
          minLength: 1
          maxLength: 32
          description: Guardian relation label (e.g. mother/father/guardian); defaults to guardian
        clientDeviceId:
          type: string
          minLength: 8
          maxLength: 128
          description: Stable client-provided device identifier; unique per parent (re-seen devices upsert)
        platform:
          type: string
          enum: [ios, android, web]

    ChildClaimRequest:
      type: object
      required: [username, pin]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        pin:
          type: string
          pattern: "^[0-9]{4}$"
        relation:
          type: string
          minLength: 1
          maxLength: 32

    DeviceSessionRequest:
      type: object
      required: [clientDeviceId, platform]
      additionalProperties: false
      properties:
        clientDeviceId:
          type: string
          minLength: 8
          maxLength: 128
        platform:
          type: string
          enum: [ios, android, web]

    ChildProfileResponse:
      type: object
      required: [studentId, username, nickname, avatar, ageYears, currentGrade, relation, parentId, consent]
      properties:
        studentId:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        ageYears:
          type: integer
        currentGrade:
          type: string
        relation:
          type: string
        status:
          type: string
          enum: [claimed]
          description: Present on claim responses; creation responses imply claimed
        claimedAt:
          type: string
          format: date-time
        parentId:
          type: string
        deviceId:
          type: string
          description: Present on creation responses (the upserted devices row)
        consent:
          type: object
          required: [policyVersion, method]
          properties:
            policyVersion:
              type: string
            method:
              type: string
              enum: [signup-form, re-consent]

    ChildrenListResponse:
      type: object
      required: [parentId, children]
      properties:
        parentId:
          type: string
        children:
          type: array
          items:
            type: object
            required:
              [studentId, username, nickname, avatar, ageYears, currentGrade, relation, status, claimedAt, activeDeviceSessions]
            properties:
              studentId:
                type: string
              username:
                type: string
              nickname:
                type: string
              avatar:
                type: string
              ageYears:
                type: integer
              currentGrade:
                type: string
              relation:
                type: string
              status:
                type: string
                enum: [claimed, archived]
              claimedAt:
                type: string
                format: date-time
              archivedAt:
                type: [string, "null"]
                format: date-time
              activeDeviceSessions:
                type: integer

    ChildArchiveResponse:
      type: object
      required: [ok, studentId, status, archivedAt]
      properties:
        ok:
          type: boolean
          const: true
        studentId:
          type: string
        status:
          type: string
          const: archived
        archivedAt:
          type: string
          format: date-time

    DeviceSessionResponse:
      type: object
      required: [sessionId, token, deviceId, studentId, expiresAt]
      properties:
        sessionId:
          type: string
        token:
          type: string
          description: The raw child device token — shown exactly once, never stored or logged
        deviceId:
          type: string
        studentId:
          type: string
        expiresAt:
          type: string
          format: date-time

    StudentPublic:
      type: object
      required: [studentId, username, nickname, avatar, ageYears, currentGrade]
      properties:
        studentId:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        ageYears:
          type: integer
        currentGrade:
          type: string
          enum: [pre-k, kindergarten, grade-1, grade-2, grade-3]

    SyncAttempt:
      type: object
      additionalProperties: false
      required: [seq, unitId, topicId, questionId, sessionType, sessionId, chosenAnswer, isCorrect, rawTimeSec, answeredAtMs, motorBaselineSec]
      description: |
        One immutable client attempt fact (device attempt_log row). Only
        facts travel the wire: the server derives cognitive time,
        fluency, and all progress through the core-engine itself —
        client-computed derivations are never trusted or accepted.
      properties:
        seq:
          type: integer
          minimum: 1
          description: Device-local AUTOINCREMENT id of the attempt_log row (monotonic per device)
        unitId:
          type: string
          minLength: 1
          maxLength: 64
        topicId:
          type: string
          minLength: 1
          maxLength: 160
        questionId:
          type: string
          minLength: 1
          maxLength: 160
        sessionType:
          type: string
          enum: [TOPIC_PRACTICE, GATE, GOLD_VERIFICATION, GAME, PLACEMENT]
        sessionId:
          type: string
          minLength: 1
          maxLength: 160
        chosenAnswer:
          type: string
          maxLength: 64
        isCorrect:
          type: boolean
        rawTimeSec:
          type: number
          minimum: 0
          maximum: 600
        audioDurationSec:
          type: number
          minimum: 0
          maximum: 600
          default: 0
        misconceptionTags:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 48
        answeredAtMs:
          type: integer
          minimum: 0
          description: Device-clock epoch ms (server clock policy applies — future skew beyond tolerance is clamped)
        motorBaselineSec:
          type: number
          minimum: 0
          maximum: 5
          description: The session's motor baseline (constant across a session's attempts; required for exact engine replay)

    SyncUploadRequest:
      type: object
      additionalProperties: false
      required: [attempts]
      properties:
        attempts:
          type: array
          minItems: 1
          maxItems: 200
          description: Whole sessions only (client drains at session boundaries); 200 is the default cap (env SYNC_MAX_ATTEMPTS_PER_BATCH)
          items:
            $ref: "#/components/schemas/SyncAttempt"
        sessionOutcomes:
          type: array
          maxItems: 50
          description: >-
            Hearts session outcomes (issue #56, roadmap D6) — one per
            Grade 2-3 fluency-sprint game session that carried hearts.
            Additive optional field (pre-#56 clients never send it);
            outcomes ride only alongside an attempts batch. Exactly-once
            per (student, session) by database constraint; counts + enum
            reason only (COPPA — no PII).
          items:
            $ref: "#/components/schemas/SessionOutcome"
        clientPacks:
          type: array
          maxItems: 10
          description: The client's installed packs for the content-version handshake (#46 refresh signal)
          items:
            type: object
            additionalProperties: false
            required: [gradeId, contentVersion]
            properties:
              gradeId:
                type: string
                minLength: 1
                maxLength: 32
              contentVersion:
                type: string
                minLength: 1
                maxLength: 32

    SessionOutcome:
      type: object
      additionalProperties: false
      required: [seq, sessionId, sessionType, stage, heartsLost, heartsRemaining, endReason, endedAtMs]
      properties:
        seq:
          type: integer
          minimum: 1
          description: Client session_outcomes row id (the ackedOutcomeIds mapping key)
        sessionId:
          type: string
          minLength: 1
          maxLength: 160
        sessionType:
          type: string
          enum: [GAME]
          description: Hearts exist only in game-framework sessions (D6)
        stage:
          type: string
          enum: [fluency]
          description: The D6 predicate mounts hearts on fluency sprints alone
        heartsLost:
          type: integer
          minimum: 0
          maximum: 5
        heartsRemaining:
          type: integer
          minimum: 0
          maximum: 5
        endReason:
          type: string
          enum: [completed, hearts-empty]
        endedAtMs:
          type: integer
          minimum: 0
          description: Device-clock epoch ms at session close (recorded as-is; telemetry, not progress math)

    SyncSnapshotUnit:
      type: object
      required: [unitId, status, keyState, bestAccuracyPct, bestMedianSpeedSec, attemptsCount, stabilityDays, lastReviewedAt, cpaStage]
      properties:
        unitId:
          type: string
        status:
          type: string
          enum: [in_progress, MASTERED, REMEDIATION_REQUIRED]
        keyState:
          type:
            - string
            - "null"
          enum: [SILVER_KEY, GOLD_KEY, null]
        bestAccuracyPct:
          type: number
        bestMedianSpeedSec:
          type: number
        attemptsCount:
          type: integer
        stabilityDays:
          type: number
        lastReviewedAt:
          type: string
        cpaStage:
          type: string
        silverAwardedAt:
          type:
            - string
            - "null"
          description: ISO timestamp of the first Silver award (frozen 14-hour window start); null = never
        goldVerifiedAt:
          type:
            - string
            - "null"
          description: ISO timestamp of the Gold verification pass; null = not yet verified

    SyncSnapshotTopic:
      type: object
      required: [topicId, unitId, topicCode, completed, crowns, masteryScore, bestAccuracyPct, bestMedianSpeedSec, attemptsCount, fluencyGrade, stabilityDays, nextReviewAt, lastReviewedAt]
      properties:
        topicId:
          type: string
        unitId:
          type: string
        topicCode:
          type: string
        completed:
          type: integer
        crowns:
          type: integer
        masteryScore:
          type: integer
        bestAccuracyPct:
          type: number
        bestMedianSpeedSec:
          type: number
        attemptsCount:
          type: integer
        fluencyGrade:
          type: integer
        stabilityDays:
          type: number
        nextReviewAt:
          type: string
        lastReviewedAt:
          type: string

    SyncProgressSnapshot:
      type: object
      required: [units, topics]
      properties:
        units:
          type: array
          items:
            $ref: "#/components/schemas/SyncSnapshotUnit"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/SyncSnapshotTopic"

    SyncUploadResponse:
      type: object
      required: [ackedSeqs, serverTime, stats, packsOutdated, progress]
      properties:
        ackedSeqs:
          type: array
          items:
            type: integer
          description: Client sequences acknowledged (inserted now or already present — both are safely synced)
        ackedOutcomeIds:
          type: array
          items:
            type: integer
          description: >-
            Hearts session-outcome row ids acknowledged (issue #56;
            inserted now or already present — both are safely synced).
            Absent when the request carried no outcomes (pre-#56
            responses stay byte-compatible).
        serverTime:
          type: string
          description: Authoritative server clock (ISO-8601)
        stats:
          type: object
          required: [inserted, duplicates, sessionsReplayed, clockSkewAdjusted]
          properties:
            inserted:
              type: integer
            duplicates:
              type: integer
            sessionsReplayed:
              type: integer
            clockSkewAdjusted:
              type: integer
            outcomesInserted:
              type: integer
              description: Hearts session outcomes stored by this batch (issue #56; duplicates of already-present rows do not count)
        packsOutdated:
          type: array
          items:
            type: object
            required: [gradeId, installedVersion, currentVersion]
            properties:
              gradeId:
                type: string
              installedVersion:
                type: string
              currentVersion:
                type: string
        progress:
          $ref: "#/components/schemas/SyncProgressSnapshot"

    PlacementRecord:
      type: object
      required: [gradeId, recommendedStartUnitId, creditedUnits, perStrand, itemsAsked, sessionId, placedAt]
      properties:
        gradeId:
          type: string
        recommendedStartUnitId:
          type: string
          description: Engine-recommended start unit (guardrails applied; never gate-locked)
        creditedUnits:
          type: array
          description: Credited prefix per strand (stability-only provisional credit)
          items:
            type: object
            required: [strand, unitIds, topics]
            properties:
              strand:
                type: string
              unitIds:
                type: array
                items:
                  type: string
              topics:
                type: array
                items:
                  type: object
                  required: [topicId, provisionalStabilityDays]
                  properties:
                    topicId:
                      type: string
                    provisionalStabilityDays:
                      type: number
                      minimum: 0
        perStrand:
          type: array
          description: Per-strand frontier report (index, credited count, cap flag)
          items:
            type: object
        itemsAsked:
          type: integer
          minimum: 0
        sessionId:
          type: string
        placedAt:
          type: string
    SyncProgressResponse:
      type: object
      required: [serverTime, packsOutdated, progress]
      properties:
        serverTime:
          type: string
          description: Authoritative server clock (ISO-8601)
        packsOutdated:
          type: array
          items:
            type: object
            required: [gradeId, installedVersion, currentVersion]
            properties:
              gradeId:
                type: string
              installedVersion:
                type: string
              currentVersion:
                type: string
        progress:
          $ref: "#/components/schemas/SyncProgressSnapshot"
        parentSettings:
          $ref: "#/components/schemas/ParentSettingsBlock"
          description: |
            #61 advisory block (additive): the parent's live limits and
            controls so an offline-first device can gate new practice
            locally before burning an upload. Advisory only — the
            refusals stay server-side.

    StudentProfile:
      description: Full student record with progress maps (shape is engine-defined and additive)
      allOf:
        - $ref: "#/components/schemas/StudentPublic"
        - type: object
          required: [motorBaselineSec, streakDays, starCoins, hearts, unitProgress, topicMastery]
          properties:
            motorBaselineSec:
              type: number
            streakDays:
              type: integer
            starCoins:
              type: integer
            hearts:
              type: integer
            unitProgress:
              type: object
              additionalProperties:
                type: object
                additionalProperties: true
            topicMastery:
              type: object
              additionalProperties:
                type: object
                additionalProperties: true

    StudentSummary:
      type: object
      required: [studentId, completedTopicsCount, masteredUnitsCount, goldKeysCount, silverKeysCount, dueSpacedReviewsCount, gardenHealthPct, totalQuestionAttemptsLogged]
      properties:
        studentId:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        ageYears:
          type: integer
        currentGrade:
          type: string
        motorBaselineSec:
          type: number
        streakDays:
          type: integer
        starCoins:
          type: integer
        hearts:
          type: integer
        completedTopicsCount:
          type: integer
        masteredUnitsCount:
          type: integer
        goldKeysCount:
          type: integer
        silverKeysCount:
          type: integer
        dueSpacedReviewsCount:
          type: integer
        gardenHealthPct:
          type: integer
        totalQuestionAttemptsLogged:
          type: integer

    StudentFullState:
      type: object
      required: [student, summary]
      properties:
        student:
          $ref: "#/components/schemas/StudentProfile"
        summary:
          $ref: "#/components/schemas/StudentSummary"

    CurriculumCounts:
      type: object
      required: [totalGrades, totalUnits, totalSkillTopics, totalPracticeQuestionsInDb]
      properties:
        totalGrades:
          type: integer
        totalUnits:
          type: integer
        totalSkillTopics:
          type: integer
        totalPracticeQuestionsInDb:
          type: integer

    CurriculumGrade:
      type: object
      required: [gradeId, gradeName, targetAgeYears, spacedRepetitionPolicy, subjects]
      properties:
        gradeId:
          type: string
        gradeName:
          type: string
        targetAgeYears:
          type: string
        spacedRepetitionPolicy:
          type: object
          required: [stabilityGrowthFactor, maxIntervalCapDays, baseScheduleDays]
          properties:
            stabilityGrowthFactor:
              type: number
            maxIntervalCapDays:
              type: integer
            baseScheduleDays:
              type: array
              items:
                type: integer
        subjects:
          type: object
          additionalProperties:
            type: object
            required: [totalUnits, totalSkillTopics, units]
            properties:
              totalUnits:
                type: integer
              totalSkillTopics:
                type: integer
              units:
                type: array
                items:
                  $ref: "#/components/schemas/CurriculumUnitSummary"

    CurriculumUnitSummary:
      type: object
      required: [unitId, sequenceOrder, title, prerequisiteUnitIds, masteryGate, skillTopics]
      properties:
        unitId:
          type: string
        sequenceOrder:
          type: integer
        title:
          type: string
        prerequisiteUnitIds:
          type: array
          items:
            type: string
        masteryGate:
          $ref: "#/components/schemas/MasteryGate"
        skillTopics:
          type: array
          items:
            type: object
            required: [code, name, topicId]
            properties:
              code:
                type: string
              name:
                type: string
              topicId:
                type: string

    CurriculumUnit:
      type: object
      required: [unitId, gradeId, subject, sequenceOrder, title, prerequisiteUnitIds, masteryGate, skillTopics]
      properties:
        unitId:
          type: string
        gradeId:
          type: string
        subject:
          type: string
        sequenceOrder:
          type: integer
        title:
          type: string
        prerequisiteUnitIds:
          type: array
          items:
            type: string
        masteryGate:
          $ref: "#/components/schemas/MasteryGate"
        skillTopics:
          type: array
          items:
            $ref: "#/components/schemas/SkillTopic"

    MasteryGate:
      type: object
      required: [questionCount, minAccuracyPercent, maxMedianResponseTimeSec, challengeZoneStreak]
      properties:
        questionCount:
          type: integer
        minAccuracyPercent:
          type: number
        maxMedianResponseTimeSec:
          type: number
        challengeZoneStreak:
          type: integer

    SkillTopic:
      type: object
      required: [topicId, code, name, assets]
      properties:
        topicId:
          type: string
        code:
          type: string
        name:
          type: string
        assets:
          type: object
          additionalProperties: true
          description: 9-asset contract payload (song, story, video, game, ...)

    PracticeQuestion:
      description: Stored practice question (shape is engine-defined and additive)
      type: object
      required: [questionId, topicId, unitId, topicCode, topicName, difficultyLevel, interactionType, prompt, visualAid, choices, correctAnswer, misconceptionTags, explanation]
      properties:
        questionId:
          type: string
        topicId:
          type: string
        unitId:
          type: string
        topicCode:
          type: string
        topicName:
          type: string
        difficultyLevel:
          type: integer
        interactionType:
          type: string
        prompt:
          type: string
        visualAid:
          type: string
        visualObjects:
          type: array
          items: {}
        targetCount:
          type: integer
        maxCounterCells:
          type: integer
        counterEmoji:
          type: string
        tileBank:
          type: array
          items:
            type: string
        choices:
          type: array
          items: {}
        correctAnswer:
          type: string
        misconceptionTags:
          type: array
          items:
            type: string
        explanation:
          type: string

    SpacedRepetitionUpdate:
      type: object
      required: [stabilityDays]
      properties:
        stabilityDays:
          type: number
        cpaStage:
          type: string
        nextReviewAt:
          type: string
          format: date-time
        retrievabilityPct:
          type: number

    PortalChildrenResponse:
      type: object
      required: [parentId, children]
      properties:
        parentId:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/PortalChildOverview"

    PortalChildOverview:
      type: object
      required: [studentId, nickname, avatar, currentGrade, streakDays, unitsStarted, unitsMastered, silverKeys, goldKeys]
      properties:
        studentId:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        currentGrade:
          type: string
        relation:
          type: string
        streakDays:
          type: integer
        lastActiveAt:
          type: string
        unitsStarted:
          type: integer
        unitsMastered:
          type: integer
          description: Units with a Silver key awarded (the platform's mastery bar)
        silverKeys:
          type: integer
        goldKeys:
          type: integer

    PortalQuadrantResponse:
      type: object
      required: [studentId, topics, generatedAt]
      properties:
        studentId:
          type: string
        topics:
          type: array
          description: Empty for a child with no recorded attempts
          items:
            $ref: "#/components/schemas/PortalQuadrantPoint"
        generatedAt:
          type: string
          format: date-time

    PortalQuadrantPoint:
      type: object
      required: [topicId, attempts, correct, accuracyPct, medianSpeedSec, quadrant]
      properties:
        topicId:
          type: string
        topicName:
          type: string
        unitId:
          type: string
        subject:
          type: string
        attempts:
          type: integer
        correct:
          type: integer
        accuracyPct:
          type: number
          description: 0-100, one decimal
        medianSpeedSec:
          type: number
          description: Exact median of per-attempt cognitive seconds
        targetSpeedSec:
          type: number
          nullable: true
          description: The unit's fluency bar (gate_max_speed_sec) — the quadrant speed split
        quadrant:
          type: string
          nullable: true
          enum: [fluent, accurate-slow, rushing, needs-review]
          description: |
            Classified at 80% accuracy (platform pass line) x unit target
            speed; null when the topic has no usable target speed.

    PortalWeeklyResponse:
      type: object
      required: [studentId, weeks, series, generatedAt]
      properties:
        studentId:
          type: string
        weeks:
          type: integer
        series:
          type: array
          items:
            $ref: "#/components/schemas/PortalWeeklyWeek"
        generatedAt:
          type: string
          format: date-time

    PortalWeeklyWeek:
      type: object
      required: [weekStartIso, attempts, correct, accuracyPct, activeMinutes, topicsPracticed, topicsFirstMastered, cumulativeTopicsMastered]
      properties:
        weekStartIso:
          type: string
          format: date-time
          description: Monday 00:00 UTC of the ISO week
        weekStartMs:
          type: integer
        attempts:
          type: integer
        correct:
          type: integer
        accuracyPct:
          type: number
          nullable: true
          description: Null on weeks with no attempts (zeroed week, no fake 0%)
        activeMinutes:
          type: number
          description: Sum of per-attempt cognitive seconds / 60
        topicsPracticed:
          type: integer
        topicsFirstMastered:
          type: integer
          description: Topics whose FIRST >=80%-accuracy session fell in this week
        cumulativeTopicsMastered:
          type: integer

    PortalChildSettings:
      type: object
      additionalProperties: false
      required: [restrictedSubjects, remindersEnabled]
      properties:
        dailyLimitMinutes:
          type: integer
          nullable: true
          minimum: 5
          maximum: 480
          description: Null = unlimited
        restrictedSubjects:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [math, ela, science, socialStudies]
        gradeCeiling:
          type: string
          nullable: true
          enum: [pre-k, kindergarten, grade-1, grade-2, grade-3]
        remindersEnabled:
          type: boolean
        reminderHour:
          type: integer
          minimum: 0
          maximum: 23
        reminderMinute:
          type: integer
          minimum: 0
          maximum: 59

    PortalSettingsResponse:
      type: object
      required: [studentId, settings, usage, serverTime]
      properties:
        studentId:
          type: string
        settings:
          $ref: "#/components/schemas/PortalChildSettings"
        updatedAt:
          type: string
          nullable: true
        usage:
          $ref: "#/components/schemas/PortalTimeLimitUsage"
        serverTime:
          type: string
          format: date-time

    PortalSettingsPutResponse:
      type: object
      required: [settings, serverTime]
      properties:
        settings:
          $ref: "#/components/schemas/PortalChildSettings"
        updatedAt:
          type: string
        serverTime:
          type: string
          format: date-time

    PortalTimeLimitUsage:
      type: object
      required: [dailyLimitMinutes, usedMinutesToday, exceeded]
      properties:
        dailyLimitMinutes:
          type: integer
          nullable: true
        usedMinutesToday:
          type: number
          description: Recorded active minutes for the current UTC day
        exceeded:
          type: boolean

    ParentSettingsBlock:
      type: object
      required: [timeLimits, contentControls, notifications]
      properties:
        timeLimits:
          $ref: "#/components/schemas/PortalTimeLimitUsage"
        contentControls:
          type: object
          required: [restrictedSubjects, gradeCeiling]
          properties:
            restrictedSubjects:
              type: array
              items:
                type: string
            gradeCeiling:
              type: string
              nullable: true
        notifications:
          type: object
          required: [remindersEnabled, reminderHour, reminderMinute]
          properties:
            remindersEnabled:
              type: boolean
            reminderHour:
              type: integer
            reminderMinute:
              type: integer
