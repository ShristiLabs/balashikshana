  /api/parent/children/{studentId}/device-sessions:
    post:
      tags: [children]
      operationId: mintChildDeviceSession
      summary: Mint a child device token scoped to exactly one student and one device
      description: |
        Requires a `Bearer` PARENT session token with a claimed binding for
        the student (none -> 403 no-child-binding; archived -> 409
        child-archived) and current-version consent FOR the student (a
        policy bump blocks minting until re-consent; 403 consent-required
        with `currentPolicyVersion`). The token is a 256-bit value stored
        hashed at rest and returned EXACTLY ONCE in this response; it
        authenticates child-scoped routes (student state, calibrate,
        practice, gate) for its bound student only, expires in 30 days,
        and dies immediately on revocation. Device binding scopes issuance
        and revocation: revoking one device's session leaves another
        device's session working.
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/SessionToken"
