        parent_children binding for the student (none -> 403
        no-child-binding; already archived -> 409 child-archived). One
        transaction flips the binding and student status to 'archived',
        stamps archived_at, revokes every live child device session, and
        deletes M1 student sessions. Archived students disappear from
